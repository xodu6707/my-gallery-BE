spring.application.name=GalleryApi
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:15432/gallery}
spring.datasource.username=${DATABASE_USER:gallery}
spring.datasource.password=${DATABASE_PASSWORD:local-smoke-only}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:11025}
management.endpoint.health.show-details=never
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_TLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
gallery.auth.owner-email=${OWNER_EMAIL:}
gallery.auth.registration-open=${REGISTRATION_OPEN:false}
gallery.auth.public-url=${PUBLIC_URL:http://localhost:15173}
gallery.auth.mail-from=${MAIL_FROM:gallery@localhost}
server.error.include-message=never
server.error.include-stacktrace=never
spring.servlet.multipart.max-file-size=${PHOTO_MAX_BYTES:52428800}B
spring.servlet.multipart.max-request-size=51MB
gallery.photos.max-bytes=${PHOTO_MAX_BYTES:52428800}
gallery.storage.endpoint=${STORAGE_ENDPOINT:http://localhost:19000}
gallery.storage.bucket=${STORAGE_BUCKET:gallery-smoke}
gallery.ingest.url=${INGEST_URL:http://localhost:18090}
gallery.ingest.token=${INGEST_TOKEN:local-development-ingest-token-change-me}
