name: a6400-stack-smoke
services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: gallery
      POSTGRES_USER: gallery
      POSTGRES_PASSWORD: local-smoke-only
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gallery -d gallery"]
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    ports: ["127.0.0.1:18025:8025"]
  storage:
    image: adobe/s3mock@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: gallery-smoke
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports: ["127.0.0.1:19000:9090"]
    volumes: ["storage-data:/s3mockroot"]
  api:
    build: ./api
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/gallery
      DATABASE_USER: gallery
      DATABASE_PASSWORD: local-smoke-only
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-gallery@localhost}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_AUTH: ${MAIL_AUTH:-false}
      MAIL_TLS: ${MAIL_TLS:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-false}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:15173}
      STORAGE_ENDPOINT: http://storage:9090
      STORAGE_BUCKET: gallery-smoke
      INGEST_URL: http://ingest:8090
      INGEST_TOKEN: ${INGEST_TOKEN:-local-development-ingest-token-change-me}
      PHOTO_MAX_BYTES: ${PHOTO_MAX_BYTES:-52428800}
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["127.0.0.1:18080:8080"]
  ingest:
    build: ./workers/ingest
    environment:
      INGEST_TOKEN: ${INGEST_TOKEN:-local-development-ingest-token-change-me}
      PHOTO_MAX_BYTES: ${PHOTO_MAX_BYTES:-52428800}
      PHOTO_MAX_PIXELS: ${PHOTO_MAX_PIXELS:-100000000}
    mem_limit: 1g
    restart: unless-stopped
    ports: ["127.0.0.1:18090:8090"]
  web:
    build: ${FRONTEND_PATH:-../frontend}
    depends_on: [api]
    ports: ["127.0.0.1:15173:80"]
volumes:
  postgres-data:
  storage-data:
